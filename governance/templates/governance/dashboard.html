<!DOCTYPE html>
<html>
<head>
    <title>GEAP Dashboard</title>
</head>
<body>
    <h1>GEAP Governance Dashboard</h1>
    <table border="1">
        <tr>
            <th>Gate Name</th>
            <th>Status</th>
            <th>Description</th>
        </tr>
       {% for gate in gates %} 
<tr>
    <td>{{ gate.gate_name }}</td>
    <td>{{ gate.status }}</td>
    <td>{{ gate.description }}</td>
</tr>
{% endfor %}
    </table>
    <a href="{% url 'download-report' %}">Download Conformity Report (JSON)</a>
</body>
</html>
